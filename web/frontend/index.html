<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSHA-Braille — 화학물질 안전보건자료 점자 변환</title>
    <meta name="description" content="한국 등록 48,966종 화학물질 MSDS를 점자로 변환하는 웹 서비스">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #fff;
            --surface-raised: #fff;
            --border: #e2e4e8;
            --border-light: #eef0f3;
            --text: #1c1e21;
            --text-secondary: #5f6368;
            --text-tertiary: #8c9097;
            --accent: #0f6b5e;
            --accent-hover: #0a5a4e;
            --accent-subtle: #e8f5f2;
            --accent-text: #0a4f44;
            --braille-bg: #1a1d23;
            --braille-text: #d4e0dc;
            --shadow-sm: 0 1px 2px rgba(28,30,33,0.04), 0 1px 3px rgba(28,30,33,0.06);
            --shadow-md: 0 2px 4px rgba(28,30,33,0.04), 0 4px 12px rgba(28,30,33,0.08);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 180ms ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Header ===== */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }
        .header-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .header-brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text);
        }
        header h1 span {
            color: var(--accent);
        }
        .header-sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-tertiary);
        }
        .stats-bar {
            display: flex;
            gap: 6px;
        }
        .stat-item {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg);
            font-variant-numeric: tabular-nums;
        }
        .stat-item strong {
            font-weight: 700;
            color: var(--accent-text);
        }

        /* ===== Tabs ===== */
        .tabs {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            gap: 4px;
            margin-top: 12px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-tertiary);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: color var(--transition), background var(--transition);
            user-select: none;
        }
        .tab:hover { color: var(--text-secondary); background: rgba(0,0,0,0.02); }
        .tab.active {
            color: var(--accent-text);
            background: var(--surface);
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        /* ===== Tab content ===== */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        main {
            max-width: 1360px;
            margin: 0 auto;
            padding: 20px 32px 48px;
        }

        /* ===== Search ===== */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 11px 16px;
            font-size: 14px;
            font-family: inherit;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .search-bar input::placeholder { color: var(--text-tertiary); }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15,107,94,0.1);
        }
        .btn {
            padding: 10px 22px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition), transform 80ms ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: var(--bg);
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover { background: #ebedf0; border-color: #d0d3d8; }

        /* ===== Layout ===== */
        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            align-items: start;
        }

        /* ===== List panel ===== */
        .list-panel {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            max-height: calc(100dvh - 240px);
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .list-panel::-webkit-scrollbar { width: 4px; }
        .list-panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .list-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
            font-variant-numeric: tabular-nums;
        }
        .list-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            transition: background var(--transition);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #f8f9fb; }
        .list-item.active { background: var(--accent-subtle); }
        .list-item .chem-id {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }
        .list-item .chem-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-top: 1px;
        }
        .list-item.active .chem-name { color: var(--accent-text); font-weight: 600; }

        /* ===== Detail panel ===== */
        .detail-panel {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            min-height: 400px;
        }
        .detail-header {
            padding: 24px 28px 18px;
            border-bottom: 1px solid var(--border-light);
        }
        .detail-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
            line-height: 1.4;
        }
        .detail-meta {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .meta-chip {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            background: var(--bg);
            padding: 3px 10px;
            border-radius: 4px;
            font-variant-numeric: tabular-nums;
        }
        .download-row {
            display: flex;
            gap: 8px;
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-light);
        }
        .download-row .btn { font-size: 12px; padding: 7px 14px; }

        .detail-body { padding: 8px 0; }

        /* ===== MSDS section ===== */
        .section {
            border-bottom: 1px solid var(--border-light);
        }
        .section:last-child { border-bottom: none; }
        .section-title {
            padding: 12px 28px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background var(--transition);
            user-select: none;
        }
        .section-title:hover { background: #f8f9fb; }
        .section-title .toggle {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-tertiary);
            transition: opacity var(--transition);
        }
        .section-title:hover .toggle { opacity: 1; }
        .section-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .section-content.collapsed { display: none; }

        .section-korean, .section-braille {
            padding: 14px 28px 18px;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.75;
        }
        .section-korean {
            border-right: 1px solid var(--border-light);
            color: var(--text);
        }
        .section-braille {
            font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", monospace;
            font-size: 15px;
            line-height: 1.8;
            background: var(--braille-bg);
            color: var(--braille-text);
            border-radius: 0;
            letter-spacing: 0.5px;
        }
        .col-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .section-braille .col-label {
            color: rgba(212,224,220,0.5);
        }

        /* ===== Convert tab ===== */
        .convert-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }
        .convert-hint {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-left: 8px;
        }
        .convert-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .convert-panel textarea {
            width: 100%;
            height: 420px;
            padding: 18px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.8;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            resize: vertical;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .convert-panel textarea::placeholder { color: var(--text-tertiary); }
        .convert-panel textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15,107,94,0.1);
        }
        .convert-output {
            width: 100%;
            height: 420px;
            padding: 18px;
            font-size: 15px;
            background: var(--braille-bg);
            color: var(--braille-text);
            border: none;
            border-radius: var(--radius);
            font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", monospace;
            line-height: 1.8;
            letter-spacing: 0.5px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .convert-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        /* ===== Placeholder / Loader ===== */
        .placeholder {
            text-align: center;
            padding: 80px 28px;
            color: var(--text-tertiary);
        }
        .placeholder .braille-hero {
            font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", monospace;
            font-size: 36px;
            color: var(--accent);
            opacity: 0.4;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }
        .placeholder p { font-size: 13px; line-height: 1.7; }
        .placeholder .sub { font-size: 12px; margin-top: 6px; color: var(--text-tertiary); opacity: 0.7; }

        .loader {
            text-align: center;
            padding: 32px;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--braille-bg);
            color: var(--braille-text);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease, transform 200ms ease;
            z-index: 100;
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Footer ===== */
        footer {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 32px 32px;
            font-size: 11px;
            color: var(--text-tertiary);
            opacity: 0.6;
        }

        /* ===== Responsive ===== */
        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; }
            .list-panel { max-height: 280px; }
            .section-content { grid-template-columns: 1fr; }
            .section-korean { border-right: none; border-bottom: 1px solid var(--border-light); }
            .convert-panel { grid-template-columns: 1fr; }
            main { padding: 16px; }
            .header-inner { flex-direction: column; align-items: flex-start; gap: 10px; padding: 0 16px; }
            .tabs { padding: 0 16px; }
            .stats-bar { flex-wrap: wrap; }
            .detail-header, .download-row, .section-title, .section-korean, .section-braille { padding-left: 16px; padding-right: 16px; }
        }
        @media (max-width: 600px) {
            .header-brand { flex-direction: column; gap: 2px; }
            .stats-bar { gap: 4px; }
            .stat-item { padding: 4px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="header-brand">
                <h1><span>KOSHA</span>-Braille</h1>
                <span class="header-sub">화학물질 안전보건자료 점자 변환</span>
            </div>
            <div class="stats-bar" id="stats-bar"></div>
        </div>
    </header>

    <div class="tabs">
        <div class="tab active" data-tab="browse" onclick="switchTab('browse')">화학물질 검색</div>
        <div class="tab" data-tab="convert" onclick="switchTab('convert')">실시간 변환</div>
    </div>

    <main>
        <!-- Tab 1: Browse chemicals -->
        <div class="tab-content active" id="tab-browse">
            <div class="search-bar">
                <input type="text" id="search" placeholder="화학물질명 또는 CAS 번호 검색" />
                <button class="btn btn-primary" onclick="search()">검색</button>
            </div>
            <div class="layout">
                <div class="list-panel">
                    <div id="list"><div class="loader">목록 불러오는 중</div></div>
                </div>
                <div class="detail-panel">
                    <div id="detail">
                        <div class="placeholder">
                            <div class="braille-hero">&#x2803;&#x2817;&#x2807;</div>
                            <p>왼쪽 목록에서 화학물질을 선택하세요</p>
                            <p class="sub">검색하거나 목록을 클릭하면 MSDS 전문이 점자로 변환됩니다</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Real-time conversion -->
        <div class="tab-content" id="tab-convert">
            <div class="convert-actions">
                <button class="btn btn-primary" onclick="convertText()">점자로 변환</button>
                <button class="btn btn-secondary" onclick="copyBraille()">복사</button>
                <button class="btn btn-secondary" onclick="clearConvert()">초기화</button>
                <span class="convert-hint">Ctrl+Enter로 변환</span>
            </div>
            <div class="convert-panel">
                <div>
                    <div class="col-label">한국어 텍스트</div>
                    <textarea id="convert-input" placeholder="여기에 한국어 텍스트를 입력하세요.&#10;&#10;예: 벤젠은 방향족 탄화수소로, 무색의 휘발성 액체입니다."></textarea>
                </div>
                <div>
                    <div class="col-label">점자 출력</div>
                    <div class="convert-output" id="convert-output"></div>
                </div>
            </div>
            <div class="convert-stats" id="convert-stats"></div>
        </div>
    </main>

    <footer>KOSHA-Braille &middot; 한국 점자 규정 (2017) 기반 &middot; 48,966종 화학물질</footer>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let currentChemId = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tabName));
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), 2000);
        }

        // Stats
        async function loadStats() {
            try {
                const r = await fetch(`${API}/stats`);
                const d = await r.json();
                document.getElementById('stats-bar').innerHTML = `
                    <div class="stat-item"><strong>${d.complete_chemicals.toLocaleString()}</strong> 화학물질</div>
                    <div class="stat-item"><strong>${d.total_sections.toLocaleString()}</strong> MSDS 섹션</div>
                    <div class="stat-item"><strong>16</strong> 섹션/물질</div>
                `;
            } catch (e) {
                document.getElementById('stats-bar').innerHTML = '';
            }
        }

        // Chemical list
        async function loadList(searchQuery = '') {
            const list = document.getElementById('list');
            list.innerHTML = '<div class="loader">검색 중</div>';
            try {
                const url = `${API}/chemicals?limit=100${searchQuery ? '&search=' + encodeURIComponent(searchQuery) : ''}`;
                const r = await fetch(url);
                const d = await r.json();
                if (d.results.length === 0) {
                    list.innerHTML = '<div class="loader">결과 없음</div>';
                    return;
                }
                list.innerHTML = `
                    <div class="list-header">${d.total.toLocaleString()}개 중 ${d.results.length}개 표시</div>
                ` + d.results.map(c => `
                    <div class="list-item" data-id="${c.chem_id}" onclick="loadDetail('${c.chem_id}')">
                        <div class="chem-id">${c.chem_id}</div>
                        <div class="chem-name">${escapeHtml(c.name)}</div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="loader">서버 연결 실패</div>';
            }
        }

        // Chemical detail
        async function loadDetail(chemId) {
            currentChemId = chemId;
            document.querySelectorAll('.list-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === chemId);
            });
            const detail = document.getElementById('detail');
            detail.innerHTML = '<div class="loader">점자 변환 중</div>';

            try {
                const r = await fetch(`${API}/chemicals/${chemId}/braille`);
                const d = await r.json();
                const ratio = d.stats.korean_chars > 0
                    ? (d.stats.braille_cells / d.stats.korean_chars).toFixed(2) : '—';

                let html = `
                    <div class="detail-header">
                        <h2>${escapeHtml(d.name)}</h2>
                        <div class="detail-meta">
                            <span class="meta-chip">ID ${d.chem_id}</span>
                            <span class="meta-chip">한국어 ${d.stats.korean_chars.toLocaleString()}자</span>
                            <span class="meta-chip">점자 ${d.stats.braille_cells.toLocaleString()}셀</span>
                            <span class="meta-chip">비율 ${ratio}x</span>
                        </div>
                    </div>
                    <div class="download-row">
                        <a href="${API}/chemicals/${chemId}/braille.txt" download class="btn btn-primary">Unicode TXT</a>
                        <a href="${API}/chemicals/${chemId}/braille.brf" download class="btn btn-secondary">BRF (엠보서)</a>
                    </div>
                    <div class="detail-body">
                `;

                for (const sec of d.sections) {
                    html += `
                        <div class="section">
                            <div class="section-title" onclick="this.nextElementSibling.classList.toggle('collapsed')">
                                <span>${sec.section_no}. ${escapeHtml(sec.title)}</span>
                                <span class="toggle">접기/펼치기</span>
                            </div>
                            <div class="section-content">
                                <div class="section-korean">
                                    <div class="col-label">한국어</div>
                                    ${escapeHtml(sec.korean)}
                                </div>
                                <div class="section-braille">
                                    <div class="col-label">점자</div>
                                    ${escapeHtml(sec.braille)}
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += '</div>';
                detail.innerHTML = html;
            } catch (e) {
                detail.innerHTML = '<div class="loader">상세 정보를 불러올 수 없습니다</div>';
            }
        }

        // Real-time conversion
        async function convertText() {
            const input = document.getElementById('convert-input').value.trim();
            if (!input) return;

            const output = document.getElementById('convert-output');
            output.textContent = '변환 중...';

            try {
                const r = await fetch(`${API}/convert`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: input}),
                });
                const d = await r.json();
                output.textContent = d.braille;
                document.getElementById('convert-stats').innerHTML = `
                    <span>입력 ${d.text_chars.toLocaleString()}자</span>
                    <span>점자 ${d.braille_cells.toLocaleString()}셀</span>
                    <span>비율 ${(d.braille_cells / d.text_chars).toFixed(2)}x</span>
                `;
            } catch (e) {
                output.textContent = '변환에 실패했습니다. 서버 연결을 확인하세요.';
            }
        }

        function copyBraille() {
            const text = document.getElementById('convert-output').textContent;
            if (text && text !== '변환 중...' && !text.startsWith('변환에 실패')) {
                navigator.clipboard.writeText(text).then(() => showToast('클립보드에 복사됨'));
            }
        }

        function clearConvert() {
            document.getElementById('convert-input').value = '';
            document.getElementById('convert-output').textContent = '';
            document.getElementById('convert-stats').innerHTML = '';
        }

        function search() {
            const q = document.getElementById('search').value.trim();
            loadList(q);
        }

        document.getElementById('search').addEventListener('keydown', e => {
            if (e.key === 'Enter') search();
        });

        document.getElementById('convert-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && e.ctrlKey) convertText();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        loadStats();
        loadList();
    </script>
</body>
</html>
